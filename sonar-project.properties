# SonarQube / SonarCloud Configuration for Edge Live-Coach
sonar.projectKey=edge-live-coach
sonar.projectName=Edge Live-Coach - Biomechanical AI Coaching (Edge WebGPU & Cloud LLM)
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Sources & Tests
sonar.sources=src,backend
sonar.tests=tests

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/data/**,**/*.db,**/*.db-shm,**/*.db-wal,**/*.test.ts,vite.config.ts,vitest.config.ts
sonar.test.inclusions=tests/**/*.test.ts

# Code Coverage Report (Vitest / LCOV)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
